name: macOS parity candidate

on:
  push:
    branches: [codex/macos-parity]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidate:
    runs-on: macos-14
    timeout-minutes: 90
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
      PDFDOCUEDIT_ENABLE_COMPOSITION: '1'
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: arm64
      - name: Install pinned Python dependencies
        run: |
          python -m pip install -r requirements-macos.txt -r requirements-dev.txt -r requirements-auth-macos.lock
          python -m pip check
      - name: Install native build tools
        run: brew install cmake autoconf automake libtool gettext pkgconf
      - uses: actions/cache/restore@v4
        id: native-cache
        with:
          key: macos-arm64-native-${{ hashFiles('build_assets/macos/SOURCES.json', 'scripts/prepare_macos.py', 'build_assets/composition/BUNDLE_INFO.json', 'scripts/prepare_composition_assets.py') }}
          path: |
            build_assets/macos/qpdf
            build_assets/macos/zbar
            build_assets/macos/ghostscript
            build_assets/macos/licenses
            build_assets/composition
      - name: Build verified native runtime sources
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: python -m scripts.prepare_macos
      - uses: actions/cache/save@v4
        if: steps.native-cache.outputs.cache-hit != 'true'
        with:
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
          path: |
            build_assets/macos/qpdf
            build_assets/macos/zbar
            build_assets/macos/ghostscript
            build_assets/macos/licenses
            build_assets/composition
      - name: Set source test runtime locations
        run: |
          echo "$GITHUB_WORKSPACE/build_assets/macos/ghostscript/bin" >> "$GITHUB_PATH"
          echo "DYLD_LIBRARY_PATH=$GITHUB_WORKSPACE/build_assets/macos/zbar/lib" >> "$GITHUB_ENV"
      - name: Source quality
        run: |
          python -m ruff check .
          python -m scripts.verify_source
      - name: Prepare offline veraPDF
        run: python -m scripts.prepare_verapdf
      - name: Build internal application and DMG
        run: python -m scripts.build --composition
      - name: Frozen application acceptance
        run: python -m scripts.macos_install_smoke --app 'dist/PDFDocuEdit Pro.app' --output build/macos-acceptance
      - name: Build managed public Mac deployment
        run: python -m scripts.build_macos_managed
      - name: Build private account-gated Mac application
        env:
          PDFDOCUEDIT_BUILD_AUTH: '1'
        run: python -m scripts.build --composition
      - name: Frozen private login and worker admission
        run: python -m scripts.macos_private_smoke --app 'dist/PDFDocuEdit Pro.app' --output build/macos-private-acceptance
      - name: Build managed private Mac deployment
        run: python -m scripts.build_macos_managed
      - name: Source and targeted platform tests
        run: python -m scripts.macos_test_plan
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macOS-arm64-internal-candidate
          path: |
            release/*macOS-arm64.dmg*
            release/*macOS-arm64-Private.dmg*
            release/*Update-macOS-arm64*.zip*
            release/candidate-update-macos-*.json
            build/macos-tests
            build/macos-acceptance/frozen.log
            build/macos-acceptance/results
            build/macos-private-acceptance/*.log
            build/macos-private-acceptance/results.json
          retention-days: 14
