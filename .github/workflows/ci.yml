name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  plan:
    name: Select test scope
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.select.outputs.full }}
      ui: ${{ steps.select.outputs.ui }}
      cross_platform: ${{ steps.select.outputs.cross_platform }}
      focused_tests: ${{ steps.select.outputs.focused_tests }}
      open_pr: ${{ steps.open-pr.outputs.open_pr }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check whether branch push already has a PR
        id: open-pr
        if: github.event_name == 'push' && github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if count=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" --jq '[.[] | select(.state == "open")] | length'); then
            if [ "$count" -gt 0 ]; then echo 'open_pr=true' >> "$GITHUB_OUTPUT"; fi
          else
            echo 'Could not check open PRs; running focused tests for safety.'
          fi
      - name: Choose tests from changed files
        id: select
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python scripts/ci_plan.py plan

  quality:
    name: Source quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-base.txt
            requirements-dev.txt
      - name: Install quality tools
        run: python -m pip install ruff==0.15.10
      - name: Ruff
        run: python -m ruff check .

  focused:
    name: Affected tests and smoke on Windows
    needs: plan
    if: needs.plan.outputs.full == 'false' && needs.plan.outputs.open_pr != 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      FOCUSED_TESTS: ${{ needs.plan.outputs.focused_tests }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-base.txt
            requirements-dev.txt
            requirements-windows.txt
      - name: Install project test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install Windows integration dependency
        run: python -m pip install comtypes==1.4.12
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Prepare pinned composition runtime
        run: python scripts/prepare_composition_assets.py
      - name: Prepare pinned Ghostscript
        uses: ./.github/actions/setup-postscript
      - name: Execute affected tests and smoke
        run: python scripts/ci_plan.py run focused "$env:FOCUSED_TESTS"

  core:
    name: Automated suite on Windows
    needs: plan
    if: needs.plan.outputs.full == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-base.txt
            requirements-dev.txt
            requirements-windows.txt
      - name: Install project test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install Windows integration dependency
        run: python -m pip install comtypes==1.4.12
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Prepare pinned composition runtime
        run: python scripts/prepare_composition_assets.py
      - name: Prepare pinned Ghostscript
        uses: ./.github/actions/setup-postscript
      - name: Execute automated suite excluding slow UI interaction tests
        run: python scripts/ci_plan.py run core
      - name: Composition performance smoke
        run: python scripts/benchmark_composition.py --records 100 --output build/composition-benchmark
      - name: Multi-page composition performance smoke
        run: python scripts/benchmark_composition.py --records 100 --pages 2 --output build/composition-benchmark/multipage
      - name: Retain composition benchmark
        uses: actions/upload-artifact@v4
        with:
          name: composition-performance-smoke
          path: build/composition-benchmark/**/benchmark.json

  ui-interaction:
    name: UI interaction tests on Windows
    needs: plan
    if: needs.plan.outputs.full == 'true' && needs.plan.outputs.ui == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-base.txt
            requirements-dev.txt
            requirements-windows.txt
      - name: Install project test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install Windows integration dependency
        run: python -m pip install comtypes==1.4.12
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Prepare pinned composition runtime
        run: python scripts/prepare_composition_assets.py
      - name: Prepare pinned Ghostscript
        uses: ./.github/actions/setup-postscript
      - name: Execute UI interaction tests
        run: python scripts/ci_plan.py run ui

  cross-platform-core:
    name: Core tests on ${{ matrix.os }}
    needs: plan
    if: needs.plan.outputs.full == 'true' && needs.plan.outputs.cross_platform == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-base.txt
            requirements-dev.txt
      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
      - name: Install project test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Prepare composition fonts
        run: python scripts/prepare_composition_assets.py --fonts-only
      - name: Run platform-neutral core tests
        run: python scripts/ci_plan.py run cross
