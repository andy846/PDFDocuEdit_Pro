name: Pinned PostScript converter for Windows acceptance
description: Install the same converter version used by the local Windows bundle.
runs:
  using: composite
  steps:
    - shell: pwsh
      run: |
        $installer = Join-Path $env:RUNNER_TEMP 'gs10051w64.exe'
        Invoke-WebRequest -Uri 'https://github.com/ArtifexSoftware/ghostpdl-downloads/releases/download/gs10051/gs10051w64.exe' -OutFile $installer
        $expected = 'A0E49D912D21D8193FF0CB89EF741A47B21286FBB0A0E35DD0192B0097D35766'
        if ((Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash -ne $expected) { throw 'Ghostscript installer checksum mismatch' }
        $destination = Join-Path $env:RUNNER_TEMP 'pdfdocuedit-ghostscript'
        $install = Start-Process -FilePath $installer -ArgumentList @('/S', "/D=$destination") -WindowStyle Hidden -Wait -PassThru
        if ($install.ExitCode -ne 0) { throw 'Ghostscript installation failed' }
        $bin = Join-Path $destination 'bin'
        $converter = Join-Path $bin 'gswin64c.exe'
        if (-not (Test-Path -LiteralPath $converter)) { throw 'Ghostscript converter missing' }
        if ((& $converter --version) -ne '10.05.1') { throw 'Unexpected Ghostscript version' }
        $bin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
