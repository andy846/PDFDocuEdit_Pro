[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdfdocuedit-pro"
version = "2.0.0"
description = "Cross-platform PDF editing and document workflow desktop application"
requires-python = ">=3.12,<3.13"
dependencies = [
    "PyQt6==6.8.1",
    "PyQt6-Qt6==6.8.2",
    "PyQt6-sip==13.9.1",
    "PyMuPDF==1.26.6",
    "numpy==2.2.6",
    "opencv-python-headless==4.12.0.88",
    "python-docx==1.2.0",
    "fonttools==4.59.0",
    "lxml==5.4.0",
    "fire==0.7.0",
    "termcolor==3.1.0",
    "openpyxl==3.1.5",
    "xlrd==2.0.1",
    "et-xmlfile==2.0.0",
    "pdf2docx==0.5.8",
    "Pillow==10.4.0",
    "pyzbar==0.1.9",
]

[project.gui-scripts]
pdfdocuedit-pro = "main:main"

[tool.setuptools]
py-modules = ["main", "PDFdocuEdit_Pro"]

[tool.setuptools.packages.find]
include = ["core*", "ui*", "styles*"]
exclude = ["backup*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "ignore:builtin type SwigPyPacked has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type SwigPyObject has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning",
]

[tool.ruff]
target-version = "py312"
line-length = 110
exclude = ["backup", "PDFdocuEdit_Pro_backup", ".venv", ".venv-pyqt6", "dist", "build", "Ghostscript"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
